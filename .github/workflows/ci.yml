name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        run: printf '%s' "$PR_TITLE" | bunx commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Format & Lint (Biome)
        run: bun run format

      - name: Lint anti-slop (oxlint)
        run: bun run lint:slop

      - name: TypeScript check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Test dependency policy
        run: bun run test:dependency-policy

      - name: Test packed package
        run: bun run test:package

      - name: Audit production dependencies
        run: bun run audit:production

      - name: Build
        run: bun run build
