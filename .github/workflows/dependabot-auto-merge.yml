name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.repository == 'cgaravitoq/tokenmax' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Await CI conclusion
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' && !contains(steps.metadata.outputs.dependency-names, 'ccusage')
        run: |
          for _ in $(seq 30); do
            if [ "$(gh pr checks "$PR_URL" --json state --jq 'length' 2>/dev/null || echo 0)" != "0" ]; then
              break
            fi
            sleep 10
          done
          gh pr checks "$PR_URL" --watch --fail-fast --interval 20

      - name: Squash merge verified patch
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' && !contains(steps.metadata.outputs.dependency-names, 'ccusage')
        run: gh pr merge --squash "$PR_URL"

      - name: Dispatch main verification
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' && !contains(steps.metadata.outputs.dependency-names, 'ccusage')
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
