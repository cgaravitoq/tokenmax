name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.repository == 'cgaravitoq/tokenmax' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Await CI conclusion
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' && !contains(steps.metadata.outputs.dependency-names, 'ccusage')
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          for _ in $(seq 30); do
            run_id="$(gh run list --workflow ci.yml --commit "$head_sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status --interval 20

      - name: Squash merge verified patch
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' && !contains(steps.metadata.outputs.dependency-names, 'ccusage')
        run: gh pr merge --squash "$PR_URL"

      - name: Dispatch main verification
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' && !contains(steps.metadata.outputs.dependency-names, 'ccusage')
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
