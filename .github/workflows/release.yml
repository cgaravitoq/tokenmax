name: Release collector

on:
  push:
    tags: ["collector-v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag against the package version
        working-directory: packages/collector
        run: test "${GITHUB_REF_NAME#collector-v}" = "$(bun -p 'require("./package.json").version')"

      - name: Format & Lint (Biome)
        run: bun run format

      - name: Lint anti-slop (oxlint)
        run: bun run lint:slop

      - name: TypeScript check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Test dependency policy
        run: bun run test:dependency-policy

      - name: Test packed package
        run: bun run test:package

      - name: Audit production dependencies
        run: bun run audit:production

      - name: Publish collector
        working-directory: packages/collector
        run: |
          version="${GITHUB_REF_NAME#collector-v}"
          if npm view "tokenmax-collector@$version" version; then
            echo "tokenmax-collector@$version is already published"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "tokenmax-collector ${GITHUB_REF_NAME#collector-v}"
        env:
          GH_TOKEN: ${{ github.token }}
